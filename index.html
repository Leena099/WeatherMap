<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Font: loads Roboto (normal and bold) for the whole page -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS: styles the map, zoom buttons, and popups. Must load before CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
    <title>Weather Map</title>
</head>
<body>
    <header>
        <h1>Weather Map</h1>
    </header>

    <main>
        <form id="search-form">
            <label for="locationInput">Location</label>
            <input type="text" id="locationInput" name="location" placeholder="Search for a location" required>
            <button type="submit">Get Weather</button>
        </form>
        
        <div id="favorites" class="favorites"></div>
        <div id="loading" class="spinner" role="status" aria-label="Loading" hidden></div>
        <div id="errorMessage" class="alert" role="alert" hidden></div>
        
        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="APIKey.js"></script>
    <script src="index.js"></script>
</body>
</html>
