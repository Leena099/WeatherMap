<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather Map</title>
</head>
<body>
    <header>
        <h1>Weather Map</h1>
    </header>

    <main>
        <form id="search-form">
            <label for="locationInput">Location</label>
            <input type="text" id="locationInput" name="location" placeholder="Search for a location" required>
            <button type="submit">Get Weather</button>

            <div id="map"></div>
        </form>

    </main>

    <script src="index.js"></script>
</body>
</html>
